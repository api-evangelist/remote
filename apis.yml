aid: remote
name: Remote
description: >-
  Remote is a global HR platform for hiring, paying, and managing employees and
  contractors across 60+ countries. Its Employer of Record (EOR), global
  payroll, contractor management, benefits, and compliance products are exposed
  through the Remote API — a RESTful, JSON-only, OAuth 2.0-protected API that
  gives partners and customers programmatic access to onboarding, employments,
  contracts, time off, expenses, incentives, payroll, invoices, and offboarding.
  The developer surface includes a downloadable OpenAPI, HMAC-signed webhooks, a
  sandbox environment, the Remote Flows embeddable SDK, and a hosted MCP server.
