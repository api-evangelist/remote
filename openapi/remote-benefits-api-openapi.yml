                        meta:
                          details_url: https://example.com
                          display_cost: 300 EUR
                          display_cost_disclaimer: Costs may vary
                required:
                - value
            properties:
              filter:
                default: individual-slug
                oneOf:
                - const: individual-slug
                  title: Individual
                - const: family-slug
                  title: Family
                type: string
                x-jsf-presentation:
                  inputType: radio
              value:
                type: string
                x-jsf-presentation:
                  inputType: radio
            title: Health
            type: object
            x-jsf-order:
            - filter
            - value
            x-jsf-presentation:
              inputType: fieldset
              meta:
                family: health
          life-group-slug:
            properties:
              value:
                oneOf:
                - const: life-premium-slug
