openapi: 3.0.0
info:
  title: Remote Address Details Currency Conversion API
  version: 0.1.0
servers:
- url: https://gateway.remote.com/
  variables: {}
- url: https://gateway.remote-sandbox.com/
  variables: {}
security:
- OAuth2: []
tags:
- name: Currency Conversion
paths:
  /v1/currency-converter/raw:
    post:
      callbacks: {}
      deprecated: false
      description: "Convert currency using FX rates used in Remote’s estimation tools.\n      These rates are not guaranteed to match final onboarding or contract rates.\n\n## Scopes\n\n| Category | Read only Scope | Write only Scope (read access implicit) |\n|---|---|---|\n| Manage company resources (`company_admin`) | Convert currencies (`convert_currency:read`) | - |\n"
      operationId: post_v1_currency-converter_raw
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyParams'
        description: Convert currency parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertCurrencyResponse'
          description: Success
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
          description: Unprocessable Entity
      security:
      - ClientToken:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2AuthorizationCode:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2ClientCredentials:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
      summary: Convert currency using flat rates
      tags:
      - Currency Conversion
  /v1/currency-converter/effective:
    post:
      callbacks: {}
      deprecated: false
      description: 'Convert currency using the rates Remote applies during employment creation and invoicing.


        ## Scopes


        | Category | Read only Scope | Write only Scope (read access implicit) |

        |---|---|---|

        | Manage company resources (`company_admin`) | Convert currencies (`convert_currency:read`) | - |

        '
      operationId: post_v1_currency-converter_effective
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyParams'
        description: Convert currency parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertCurrencyResponse'
          description: Success
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
          description: Unprocessable Entity
      security:
      - ClientToken:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2AuthorizationCode:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2ClientCredentials:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
      summary: Convert currency using dynamic rates
      tags:
      - Currency Conversion
  /v1/currency-converter:
    post:
      callbacks: {}
      deprecated: false
      description: 'Convert currency using the rates Remote applies during employment creation and invoicing.


        ## Scopes


        | Category | Read only Scope | Write only Scope (read access implicit) |

        |---|---|---|

        | Manage company resources (`company_admin`) | Convert currencies (`convert_currency:read`) | - |

        '
      operationId: post_v1_currency-converter_effective (2)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyParams'
        description: Convert currency parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertCurrencyResponse'
          description: Success
        '401':
          content:
            application/json:
              schema:
