          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
          description: Unprocessable Entity
      security:
      - ClientToken:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2AuthorizationCode:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
        OAuth2ClientCredentials:
        - https://gateway.remote.com/company.manage
        - convert_currency:read
        - company_admin
        - all:write
        - all:read
      summary: Convert currency using dynamic rates
      tags:
      - Currency Conversion
components:
  schemas:
    ConvertCurrency:
      additionalProperties: false
      description: The response from the currency converter
      example:
        exchange_rate: 0.85
        source_amount: 1000
        source_currency:
          code: CZK
          name: Czech Koruna
          symbol: Kč
        target_amount: 850
        target_currency:
          code: CZK
          name: Czech Koruna
          symbol: Kč
      properties:
        exchange_rate:
          description: The exchange rate used to convert the amount
          type: number
        source_amount:
          description: The amount in cents in the source currency
          type: integer
        source_currency:
          $ref: '#/components/schemas/CurrencyDefinition'
        target_amount:
          description: The amount in cents in the target currency
          type: integer
        target_currency:
          $ref: '#/components/schemas/CurrencyDefinition'
      required:
      - source_amount
      - source_currency
      - target_amount
      - target_currency
      - exchange_rate
      title: ConvertCurrency
      type: object
    ParameterError:
      example:
        code: invalid_param
        message: Invalid parameter
        param: employment_id
      properties:
        code:
          description: An error code that describes the nature of the error.
          type: string
        message:
          description: A developer friendly error message that gives details on what the error was and how it may be remedied.
          type: string
        param:
          description: The parameter that lead to the error message.
          type: string
      required:
      - code
      - message
      - param
      title: ParameterError
      type: object
    CurrencyDefinition:
      description: Currency object without a UUID identifier
      example:
        code: CZK
        name: Czech Koruna
        symbol: Kč
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
      required:
      - code
      - name
      - symbol
      title: CurrencyDefinition
      type: object
    UnauthorizedResponse:
      description: Returned when the request does not include valid authentication credentials. Ensure you are passing a valid OAuth2 access token or API token in the Authorization header.
      example:
        message: Unauthorized
      properties:
        message:
          pattern: Unauthorized
          type: string
      required:
      - message
      title: UnauthorizedResponse
      type: object
    ConvertCurrencyParams:
      additionalProperties: false
      description: The parameters for the currency conversion
      example:
        amount: 1000
        source_currency: USD
        target_currency: EUR
      properties:
        amount:
          description: The amount to convert in cents
          minimum: 0
          type: integer
        source_currency:
          description: The currency code to convert from
          maxLength: 3
          minLength: 3
          type: string
        target_currency:
          description: The currency code to convert to
          maxLength: 3
          minLength: 3
          type: string
      required:
      - source_currency
      - target_currency
      - amount
      title: ConvertCurrencyParams
      type: object
    UnprocessableEntityResponse:
      anyOf:
      - properties:
          errors:
            type: object
        required:
        - errors
        type: object
      - properties:
          message:
            oneOf:
            - type: string
            - $ref: '#/components/schemas/ParameterError'
            - items:
                $ref: '#/components/schemas/ParameterError'
              title: ParameterErrors
              type: array
            - $ref: '#/components/schemas/ActionError'
            - items:
                $ref: '#/components/schemas/ActionError'
              title: ActionErrors
              type: array
        required:
        - message
        type: object
      example:
        errors:
          some_field:
          - is invalid
      title: UnprocessableEntityResponse
      type: object
    NotFoundResponse:
      description: Returned when the requested resource does not exist or is not accessible with the current authentication credentials.
      example:
        message: '{resource} not found'
      properties:
        message:
          description: A message indicating which resource was not found.
          pattern: Not Found
          type: string
      title: NotFoundResponse
      type: object
    ConvertCurrencyResponse:
      additionalProperties: false
      description: The response from the currency converter
      example:
        data:
          conversion_data:
            exchange_rate: 0.85
            source_amount: 1000
            source_currency:
              code: CZK
              name: Czech Koruna
              symbol: Kč
            target_amount: 850
            target_currency:
              code: CZK
              name: Czech Koruna
              symbol: Kč
      properties:
        data:
          additionalProperties: false
          properties:
            conversion_data:
              $ref: '#/components/schemas/ConvertCurrency'
          required:
          - conversion_data
          type: object
      required:
      - data
      title: ConvertCurrencyResponse
      type: object
    ActionError:
      properties:
        action:
          description: The action that lead to the error message.
          type: string
        code:
          description: An error code that describes the nature of the error.
          type: string
        message:
          description: A developer friendly error message that gives details on what the error was and how it may be remedied.
          type: string
      required:
      - code
      - message
      - action
      title: ActionError
      type: object
  securitySchemes:
    BasicAuth:
      description: 'Authenticate using the basic authentication for partners.


        Use the CLIENT_ID as login and CLIENT_SECRET as password.

        '
      scheme: basic
      type: http
    ClientToken:
      description: 'Authenticate a partner using only the the provided `client_token`.


        This authentication method only allows accessing marketing endpoints.

        '
      scheme: bearer
      type: http
    CustomerAPIToken:
      description: 'Authenticate using API Key generated by the customer in their Integration Settings page.

        '
      scheme: bearer
      type: http
    OAuth2:
