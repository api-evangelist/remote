            net_salary: null
            slug: 7f4bc535-3d7a-43f5-ab44-360ca91acc7a
        total_count: 1
        total_pages: 1
      properties:
        data:
          properties:
            current_page:
              description: The current page among all of the total_pages
              type: integer
            payslips:
              items:
