openapi: 3.0.0
info:
  title: Remote Address Details Employee State Taxes API
  version: 0.1.0
servers:
- url: https://gateway.remote.com/
  variables: {}
- url: https://gateway.remote-sandbox.com/
  variables: {}
security:
- OAuth2: []
tags:
- name: Employee State Taxes
paths:
  /v1/employee/state-taxes/{jurisdiction}:
    put:
      callbacks: {}
      deprecated: false
      description: 'Submits the authenticated employee''s US state tax withholding answers for a

        single jurisdiction (e.g. `NY`).


        Available for US Global Payroll employees once they reach the post-enrollment

        state, at which point the per-jurisdiction state tax task exists.


        This endpoint requires country/jurisdiction-specific data. Query the

        [Show form schema](#tag/Countries/operation/get_show_form_country) endpoint with `global_payroll_state_taxes`

        as the form name to discover the schema for a given country.




        ## Scopes


        | Category | Read only Scope | Write only Scope (read access implicit) |

        |---|---|---|

        | Manage employments (`employments`) | - | Manage personal details (`personal_detail:write`) |

        '
      operationId: put_v1_employee_state-taxes_jurisdiction
      parameters:
      - description: Two-letter US state/jurisdiction code
        example: NY
        in: path
        name: jurisdiction
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentStateTaxesParams'
        description: Employee state taxes params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
          description: Unprocessable Entity
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
          description: Unprocessable Entity
      security:
      - OAuth2Assertion:
        - personal_detail:write
        - employments
        - all:write
      summary: Submit employee state taxes
      tags:
      - Employee State Taxes
