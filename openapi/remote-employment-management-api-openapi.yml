    EmploymentV2UpdateParams:
      additionalProperties: false
      description: Parameters for updating employment-level fields such as department, manager, work email, and external ID.
      example:
        external_id: ext-12345
        work_email: jane.smith@company.com
      properties:
        department_id:
          description: 'The department of the employment. The department must belong to the same company as the employment.

            When set to `null`, the employment will be unassigned from a department.

            '
          nullable: true
          type: string
        external_id:
          description: A unique reference code for the employment record in a non-Remote system. This optional field links to external data sources. If not provided, it defaults to `null`. While uniqueness is recommended, it is not strictly enforced within Remote's system.
          maxLength: 64
          type: string
        manager_id:
          description: 'The user id of the manager, who should have an `admin`, `owner` or `people_manager` role.

            You can find these users by querying the [Company Managers endpoint](#operation/get_index_company_manager).

            '
          type: string
        work_email:
          description: The work email of the employment.
          type: string
      title: EmploymentV2UpdateParams
      type: object
    ProvisionalStartDate:
      description: 'Indicates the expected start date of the employee or contractor.


        Required for employees, but optional for contractors. Date format is in ISO8601 without the time component.


        See the **Date and Time Format** documentation for more details on how the Remote API works with dates.

        '
      example: '2022-03-21'
      format: date
      title: ProvisionalStartDate
      type: string
