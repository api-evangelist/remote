        content:
          application/json:
            schema:
              properties:
                contract_origin:
                  enum:
                  - remote_contract
                  - custom_remote_contract
                  - provided_by_customer
                  example: provided_by_customer
                  type: string
                template_type:
                  description: Required when contract_origin is remote_contract or custom_remote_contract, ignored when provided_by_customer
                  enum:
