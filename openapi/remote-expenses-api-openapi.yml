        reviewed_at:
          description: Not applicable for draft expenses. Always null.
          format: date
          nullable: true
          type: string
        reviewer:
          description: Not applicable for draft expenses. Always null.
          nullable: true
          properties:
            user_email:
              description: The reviewer's email address.
              type: string
            user_id:
              description: The unique identifier of the reviewer.
              type: string
            user_name:
              description: The reviewer's full name.
              type: string
          type: object
        status:
          description: 'The draft status.


            - `draft`: The expense is saved as a draft by the employee and not submitted for approval.

            - `archived`: The draft was soft-deleted by the employee.

            '
          enum:
          - draft
          - archived
          type: string
        tax_amount:
          description: The tax portion in the original currency, in cents. Null if not yet entered.
          nullable: true
          type: integer
        title:
          description: A short description of the expense. May be null in drafts.
          nullable: true
          type: string
      required:
      - id
      - title
      - employment_id
      - amount
      - converted_amount
      - currency
      - converted_currency
      - expense_date
      - tax_amount
      - converted_tax_amount
      title: DraftExpense
      type: object
    ExpenseCategoryNode:
      description: A single expense category in the flat list structure
      example:
        code: travel.flights
        description: Flight expenses for business travel
        instructions: Please include flight confirmation number
        is_selectable: true
        parent:
          code: travel
          slug: travel-abc123
          title: Travel
        prompt: What was the purpose of this flight?
        scope: global
        slug: travel-flights-abc123
        status: active
        title: Flights
      properties:
        code:
          description: Category code (e.g., 'travel.flights')
          type: string
        description:
          description: Category description
          nullable: true
          type: string
        instructions:
          description: Instructions for using this category
          nullable: true
          type: string
        is_selectable:
          description: Whether this category can be selected
          type: boolean
        parent:
          description: Parent category information if this is a child category
          nullable: true
          properties:
            code:
              description: Parent category code
              type: string
            slug:
              description: Parent category slug
              type: string
            title:
              description: Parent category title
              type: string
          type: object
        prompt:
          description: Prompt for user guidance
          nullable: true
          type: string
        scope:
          description: Category scope (global, country, company, legal_entity)
          type: string
        slug:
          description: Unique identifier for the category
          type: string
        status:
          description: Category status (active, inactive)
          type: string
        title:
          description: Human-readable category name
          type: string
      title: ExpenseCategoryNode
      type: object
    TooManyRequestsResponse:
      description: Returned when the API rate limit has been exceeded (HTTP 429). Wait before retrying. Check the `Retry-After` response header for the recommended wait time.
      example:
        message: Too many requests
      properties:
        message:
          pattern: Too many requests
          type: string
      title: TooManyRequestsResponse
      type: object
