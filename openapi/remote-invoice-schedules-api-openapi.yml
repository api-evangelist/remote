    ContractorInvoiceScheduleStatus:
      description: 'Current record state.


        - `active`: Once an invoice is generated, and a withdrawal method has been set, then it''s set to active.

        - `processing`: Ephemeral status indicating that we are currently attempting to generate a contractor invoice from the scheduled contractor invoice.

        - `pending_company_action`: Company needs to trigger some actions related to payment configuration.

        - `pending_contractor_action`: When schedule is blocked by contractor onboarding or invoice generation failed due to withdrawal methods issues that needs contractor action.

        - `generation_failed_unrelated_to_withdrawal_method`: Generation failed for any other reason.

        - `completed`: Number of generated contractor invoices has been reached.

        - `inactive`: Does not create any further contractor invoices but it''s still possible for the employer to activate it again.

        '
      enum:
      - inactive
      - completed
      - active
      - processing
      - pending_company_action
      - pending_contractor_action
      - generation_failed_unrelated_to_withdrawal_method
      example: active
      nullable: false
      title: ContractorInvoiceScheduleStatus
      type: string
    TooManyRequestsResponse:
      description: Returned when the API rate limit has been exceeded (HTTP 429). Wait before retrying. Check the `Retry-After` response header for the recommended wait time.
      example:
        message: Too many requests
      properties:
        message:
          pattern: Too many requests
          type: string
      title: TooManyRequestsResponse
      type: object
    ContractorInvoiceSchedulePeriodicity:
      description: "Defines how often contractor invoices will be generated.\n\n- `bi_weekly`: Invoices will be generated every other week, on the given day of the week based on the start date.\n- `monthly`: Invoices will be generated once a month.\n- `semi_monthly`: Invoices will be generated at fixed dates twice a month (with 14 days of difference between each other), depending on the start date.\n   In months with just 30 days, if `start_date` is set to the 31st day, then generation occurs in the last of day of the month.\n- `weekly`: Invoices will be generated each week.\n"
      enum:
      - bi_weekly
      - monthly
      - semi_monthly
      - weekly
      example: monthly
      nullable: false
      title: ContractorInvoiceSchedulePeriodicity
      type: string
