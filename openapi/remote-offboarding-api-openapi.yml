          description: A description of how and when the employer was made aware of the resignation.
          type: string
        employment_id:
          description: The unique identifier (UUID) of the employment being resigned from.
          type: string
        id:
          description: The unique identifier (UUID) of the offboarding request.
          type: string
        offboarding_id:
          description: 'The unique identifier (UUID) of the offboarding record. When present, this can be used

            to query `GET /api/eor/v2/offboardings/{id}` for the v2 offboarding shape.

            '
          nullable: true
          type: string
        proposed_last_working_day:
          description: The employee's proposed last working day. The actual last day may differ based on notice period requirements.
          format: date
          type: string
        reason_description:
          description: A detailed description of the employee's reason for resigning.
          type: string
        requested_by:
          description: The unique identifier (UUID) of the employee who submitted the resignation.
          type: string
        resignation_reason:
          description: The reason the employee gave for their resignation.
          enum:
          - cancellation_before_start_date
          - company_culture_or_values
          - conversion_to_contractor
          - conversion_to_global_payroll
          - conversion_to_peo
          - dissatisfaction_with_remote_service
          - incapacity_to_perform_inherent_duties
          - infrastructure_challenges
          - lack_of_recognition
          - leadership
          - mutual_agreement
          - other
          - other_job_opportunity
          - personal_reasons
          - position_does_not_meet_expectations
          - relationship_with_coworkers
          - relocation_from_entity_to_entity_by_employee
          - relocation_leaving_remote
          - remuneration_and_benefits
          - retirement
          - transfer_and_relocation_new_customer_and_new_country
          - transfer_between_remote_customer
          - transfer_from_remote_to_customer
          - transfer_from_remote_to_other_eor
          type: string
        status:
          description: 'The current status of the offboarding request.


            - `submitted`: The resignation has been submitted and is awaiting review.

            - `in_review`: Remote is processing the resignation.

            - `done`: The offboarding has been completed.

            - `canceled`: The resignation was withdrawn or canceled.

            '
          enum:
          - submitted
          - in_review
          - done
          - canceled
          type: string
        submitted_at:
          description: The timestamp when the resignation was submitted.
          format: datetime
          type: string
        termination_date:
          description: Most updated termination date for the offboarding. This date is subject to change through the offboarding process even after it is finalized.
          format: date
          nullable: true
          type: string
        type:
