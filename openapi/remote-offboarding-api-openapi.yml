  /v1/travel-letter-requests:
    get:
      callbacks: {}
      deprecated: false
      description: 'List travel letter requests.


        ## Scopes


        | Category | Read only Scope | Write only Scope (read access implicit) |

        |---|---|---|

        | Manage employment documents (`employment_documents`) | View travel letters (`travel_letter:read`) | Manage travel letters (`travel_letter:write`) |

        '
      operationId: get_v1_travel-letter-requests
      parameters:
      - description: Filter results on the given status
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - cancelled
          - declined_by_manager
          - declined_by_remote
          - approved_by_manager
          - approved_by_remote
          type: string
      - description: Filter results on the given employment slug
        in: query
        name: employment_id
        required: false
        schema:
          type: string
      - description: Filter results on the given employee name
        in: query
        name: employee_name
        required: false
        schema:
          type: string
      - description: Sort order
        example: asc
        in: query
        name: order
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: Field to sort by
        example: submitted_at
        in: query
        name: sort_by
        required: false
        schema:
          enum:
          - submitted_at
          type: string
      - description: Starts fetching records after the given page
        example: 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Number of items per page
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTravelLettersResponse'
          description: Success
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityResponse'
          description: Unprocessable Entity
      security:
      - CustomerAPIToken:
        - https://gateway.remote.com/company.manage
        - travel_letter:read
        - travel_letter:write
        - employment_documents
        - all:write
        - all:read
        OAuth2AuthorizationCode:
        - https://gateway.remote.com/company.manage
        - travel_letter:read
