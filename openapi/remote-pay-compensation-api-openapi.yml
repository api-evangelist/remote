            subdivision_type: District
          - code: PT-11
            name: Lisboa
            subdivision_type: District
          employment_agreement_preview_available: true
          eor_onboarding: true
          locked_benefits: after_first_hire
          name: Portugal
          region: Europe
          subregion: Southern Europe
          supported_json_schemas:
          - additional_documents
          - address_details
          - administrative_details
          - employment-basic-information
          - bank_account_details
          - contract_details
          - emergency_contact
        currency_code: USD
        cutoff_date: '2021-01-20'
        expected_payout_date: '2021-01-25'
        id: 123e4567-e89b-12d3-a456-426614174000
        period_end: '2021-01-31'
        period_start: '2021-01-01'
        status: preparing
        total_payroll_cost: 1000
        type: main
      properties:
        approval_date:
          $ref: '#/components/schemas/NullableDate'
        country:
          $ref: '#/components/schemas/Country'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        cutoff_date:
          $ref: '#/components/schemas/NullableDate'
        expected_payout_date:
          $ref: '#/components/schemas/Date'
        id:
          description: The unique identifier of the payroll run.
          format: uuid
          type: string
        period_end:
          $ref: '#/components/schemas/Date'
        period_start:
          $ref: '#/components/schemas/Date'
        status:
          description: 'The current status of the payroll run.


            - `preparing`: The payroll run is being assembled. Costs are estimates.

            - `processing`: Submitted for processing. Costs are still estimates.

            - `completed`: Processing is complete. Costs are final.

            - `finalized`: Payments have been or will be disbursed.

            - `waiting_for_customer_approval`: Requires company approval before proceeding.

            - `rejected`: Rejected during approval and needs revision.

            '
          enum:
          - preparing
          - processing
          - completed
          - finalized
          - waiting_for_customer_approval
          - rejected
          type: string
        total_payroll_cost:
          description: The total cost of this payroll run across all employees. Amount in cents.
          type: integer
        type:
          description: 'The type of payroll run.


            - `main`: Regular recurring payroll.

            - `one_off`: Ad-hoc off-cycle payment.

            - `pro_forma`: Simulated run for cost estimation.

            - `tax_documents`: Tax document generation only.

            - `expenses`: Dedicated expense reimbursement run.

            - `parallel`: Supplementary run alongside the main payroll.

            '
          enum:
          - main
          - one_off
          - pro_forma
          - tax_documents
          - expenses
          - parallel
          type: string
      required:
      - id
      - status
      - period_start
      - period_end
      - approval_date
      - expected_payout_date
      - currency_code
      - country
      - total_payroll_cost
      - type
