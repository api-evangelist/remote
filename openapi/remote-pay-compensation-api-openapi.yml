      example:
        exchange_rate: 0.85
        source_amount: 1000
        source_currency:
          code: CZK
          name: Czech Koruna
          symbol: Kč
        target_amount: 850
        target_currency:
          code: CZK
          name: Czech Koruna
          symbol: Kč
      properties:
        exchange_rate:
          description: The exchange rate used to convert the amount
          type: number
        source_amount:
          description: The amount in cents in the source currency
          type: integer
        source_currency:
          $ref: '#/components/schemas/CurrencyDefinition'
        target_amount:
          description: The amount in cents in the target currency
          type: integer
        target_currency:
          $ref: '#/components/schemas/CurrencyDefinition'
      required:
      - source_amount
      - source_currency
      - target_amount
      - target_currency
      - exchange_rate
      title: ConvertCurrency
      type: object
    ParameterError:
