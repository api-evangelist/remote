        period_start: '2021-01-01'
        salary_total: 1000
        status: preparing
        total_payroll_cost: 1000
      properties:
        approval_date:
          $ref: '#/components/schemas/NullableDate'
        benefits_total:
          description: The total benefits cost across all employees in this payroll run. Amount in cents.
          type: integer
        country:
          $ref: '#/components/schemas/Country'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        cutoff_date:
          $ref: '#/components/schemas/NullableDate'
        employee_details:
          deprecated: true
          description: Per-employee cost breakdown for this payroll run. Deprecated — use the dedicated `GET /v1/payroll-runs/{payroll_run_id}/employee-details` endpoint instead, which supports pagination.
          items:
            $ref: '#/components/schemas/EmployeeDetails'
          type: array
        employer_contributions_total:
          description: The total employer-side contributions (social contributions, employer taxes, etc.) across all employees. Amount in cents.
          type: integer
        expected_payout_date:
          $ref: '#/components/schemas/Date'
        expenses_total:
          description: The total reimbursed expenses across all employees in this payroll run. Amount in cents.
          type: integer
        id:
          description: The unique identifier of the payroll run.
          format: uuid
          type: string
        incentives_total:
          description: The total incentives (bonuses, commissions, etc.) across all employees in this payroll run. Amount in cents.
          type: integer
        other_total:
          description: The total of other payroll components not categorized elsewhere. Amount in cents.
          type: integer
        period_end:
          $ref: '#/components/schemas/Date'
        period_start:
          $ref: '#/components/schemas/Date'
        salary_total:
          description: The total base salary amount across all employees in this payroll run. Amount in cents.
          type: integer
        status:
          description: 'The current status of the payroll run.


            - `preparing`: The payroll run is being assembled. Employee details and costs are estimates and may change.

            - `processing`: The payroll run has been submitted for processing by the local payroll provider. Costs are still estimates.

            - `completed`: Payroll processing is complete. Costs are final and payslips are available.

            - `finalized`: The payroll run has been finalized and payments have been or will be disbursed.

            - `waiting_for_customer_approval`: The payroll run requires approval from the company before it can proceed.

            - `rejected`: The payroll run was rejected during the approval process and needs to be revised.

            '
          enum:
          - preparing
          - processing
          - completed
          - finalized
          - waiting_for_customer_approval
          - rejected
          type: string
        total_payroll_cost:
          description: The total cost of this payroll run across all employees, including salaries, benefits, employer contributions, expenses, and incentives. Amount in cents.
          type: integer
        type:
          description: 'The type of payroll run.


            - `main`: The regular recurring payroll for the period.

            - `one_off`: An ad-hoc payroll run outside the regular cycle, typically for off-cycle payments.

            - `pro_forma`: A simulated payroll run used for cost estimation purposes. Not actually processed.

            - `tax_documents`: A payroll run for generating tax-related documents only.

            - `expenses`: A payroll run dedicated to reimbursing approved expenses.

            - `parallel`: A supplementary payroll run that runs alongside the main payroll for the same period.

            '
          enum:
          - main
          - one_off
          - pro_forma
          - tax_documents
          - expenses
          - parallel
          type: string
      required:
      - id
      - status
      - period_start
      - period_end
      - approval_date
      - expected_payout_date
      - currency_code
      - country
      - total_payroll_cost
      - salary_total
      - benefits_total
      - incentives_total
      - expenses_total
      - other_total
      - employer_contributions_total
      - employee_details
      title: PayrollRun
      type: object
    Currency:
      description: The type of money in general use in a particular country
      example:
        code: EUR
        name: European Euro
        slug: eur-3b840951-099f-4bd5-90b9-032f7bfe51d9
        symbol: €
      properties:
        code:
          type: string
        name:
          type: string
        slug:
          type: string
        symbol:
          type: string
      required:
      - code
      - slug
      - symbol
      title: Currency
      type: object
    CommonIncentiveParams:
      example:
        amount: 50000
        amount_tax_type: net
        effective_date: '2021-12-20'
        note: Bonus for moving start date to an earlier date
      properties:
        amount:
          description: 'The amount (in the currency of the employment) to be given to the employee.


            This field accepts fractional amounts as well. However to avoid precision issues

            and errors that can arise from storing fractional amounts, the Remote API only

            accepts currencies and their fractional amounts as integers. This means you

            should append fractional amounts to the end of the amount you''re passing in with

            this field.


            For example, if the incentive you''re offering is EUR 500.25, you would specify `50025` as

            the amount for this field.

            '
          type: integer
        amount_tax_type:
          $ref: '#/components/schemas/AmountTaxType'
        effective_date:
          description: 'The date at which the incentive should take effect.


            Note that the incentive is not paid out on the effective date, but during the

            next payroll cycle. The effective date determines which payroll cycle the

            incentive will be paid out in.


            The effective date needs to be today or a future date.


            Note for recurring incentives: since the months don''t have the same amount of days,

            if day of month of `effective_date` is one of [28, 29, 30, 31] it will be transformed to

            the last day of each month, avoiding the possibility of skipping a month in the recurrence.

            '
          format: date
          type: string
        note:
          nullable: true
          type: string
      title: CommonIncentiveParams
      type: object
    DeleteRecurringIncentiveResponse:
      description: '`"status": "ok"` indicates that any recurring incentives with `pending` status were

        successfully deleted.


        `already_scheduled_incentives` returns a list of incentives that were already scheduled

        for payout and as such, cannot be deleted. You will notice that these incentives do not

        have a `pending` status.

        '
      example:
        data:
          already_scheduled_incentives: []
          status: ok
      properties:
        data:
          properties:
            already_scheduled_incentives:
              items:
                $ref: '#/components/schemas/Incentive'
              type: array
            status:
              type: string
          required:
          - already_scheduled_incentives
          type: object
      required:
      - data
      title: DeleteRecurringIncentiveResponse
      type: object
    EmployeeDetails:
      description: Payroll cost breakdown for a single employee within a payroll run. All monetary amounts are represented as an object with `amount` (integer, in cents) and `currency` (ISO 4217 code).
      example:
        base_salary:
          amount: 1000
          currency: USD
        benefits:
          amount: 100
          currency: USD
        deductions:
          amount: 200
          currency: USD
        employer_costs:
          amount: 100
          currency: USD
        expenses:
          amount: 100
          currency: USD
        full_name: John Doe
        gross_pay:
          amount: 1000
          currency: USD
        incentives:
          amount: 100
          currency: USD
        net_pay:
          amount: 800
          currency: USD
        other:
          amount: 100
          currency: USD
        payslip_id: 123e4567-e89b-12d3-a456-426614174000
        total_cost:
          amount: 1000
          currency: USD
      properties:
        base_salary:
          description: The employee's base salary component for this payroll period. When the payroll run is in `preparing` or `processing` status, this is an estimate that may change after final payroll calculations. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        benefits:
          description: Total cost of employee benefits (health insurance, pension, etc.) for this payroll run. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        deductions:
          description: Total deductions from the employee's gross pay, including taxes and social contributions. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        employer_costs:
          description: Total employer-side contributions and costs (employer social contributions, taxes, etc.) beyond the employee's gross pay. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        employment_id:
          description: The unique identifier of the employment record for this employee.
          format: uuid
          type: string
        expenses:
          description: Total approved expenses reimbursed to the employee in this payroll run. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        full_name:
          description: The full name of the employee. May be null if the employee's profile is incomplete.
          nullable: true
          type: string
        gross_pay:
          description: The employee's gross pay before any deductions. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        incentives:
          description: Total incentives (bonuses, commissions, etc.) paid to the employee in this payroll run. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        net_pay:
          description: The net amount paid to the employee after all deductions (taxes, social contributions, etc.). Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        other:
          description: Any other payroll components not categorized as salary, benefits, expenses, or incentives. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
        payslip_id:
          description: The unique identifier of the employee's payslip for this payroll run. Null when the payroll run is still in `preparing` or `processing` status and payslips have not yet been generated.
          format: uuid
          nullable: true
          type: string
        total_cost:
          description: The total cost to the employer for this employee in this payroll run, including salary, benefits, employer contributions, expenses, and incentives. Amount in cents.
          properties:
            amount:
              description: Amount in cents.
              type: integer
            currency:
              description: ISO 4217 currency code.
              type: string
          type: object
      required:
      - full_name
      - payslip_id
      - total_cost
      - net_pay
      - gross_pay
      - deductions
      - base_salary
      - expenses
      - incentives
      - other
      - benefits
      - employer_costs
      title: EmployeeDetails
      type: object
