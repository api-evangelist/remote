        - employee_inclusion_cutoff_date: '2021-01-20'
          end_date: '2021-01-31'
          input_cutoff_date: '2021-01-15'
          payment_date: '2021-01-25'
          start_date: '2021-01-01'
        owned_by_remote: true
      properties:
        country:
          $ref: '#/components/schemas/Country'
        cycle_frequency:
          $ref: '#/components/schemas/CycleFrequency'
        cycles:
          items:
            $ref: '#/components/schemas/Cycle'
          type: array
        owned_by_remote:
          type: boolean
      required:
      - country
      - owned_by_remote
      - cycle_frequency
      - cycles
      title: PayrollCalendar
      type: object
    CycleFrequency:
      description: The frequency at which the payroll calendar is run.
      enum:
      - monthly
      - bi_monthly
      - bi_weekly
      - weekly
      example: monthly
      title: CycleFrequency
      type: string
    Cycle:
      example:
        employee_inclusion_cutoff_date: '2021-01-20'
        end_date: '2021-01-31'
        input_cutoff_date: '2021-01-15'
        payment_date: '2021-01-25'
        start_date: '2021-01-01'
      properties:
        employee_inclusion_cutoff_date:
          format: date
          type: string
        end_date:
          format: date
          type: string
        input_cutoff_date:
          format: date
          type: string
        payment_date:
          format: date
          type: string
        start_date:
          format: date
