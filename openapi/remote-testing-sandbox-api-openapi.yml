      nullable: true
      properties:
        salary_decrease_reason:
          enum:
          - change_in_working_hours
          - trade_salary_for_equity
          - error_in_initial_salary
          - role_change_or_demotion
          - compensation_restructure
          - other
          type: string
        salary_decrease_reason_description:
          nullable: true
          type: string
        was_employee_informed:
          type: string
      title: SalaryDecreaseDetails
      type: object
    NullableCountry:
      description: A supported country on Remote
      example:
        alpha_2_code: PT
        code: PRT
        contractor_products_available:
        - standard
        - plus
        - cor
        country_subdivisions:
        - code: PT-06
          name: Coimbra
          subdivision_type: District
        - code: PT-11
          name: Lisboa
          subdivision_type: District
        employment_agreement_preview_available: true
        eor_onboarding: true
        locked_benefits: after_first_hire
        name: Portugal
        region: Europe
        subregion: Southern Europe
        supported_json_schemas:
        - additional_documents
        - address_details
        - administrative_details
        - employment-basic-information
        - bank_account_details
        - contract_details
        - emergency_contact
      nullable: true
      properties:
        alpha_2_code:
          description: The ISO 3166-1 alpha-2 country code (e.g., "PT").
          type: string
        code:
          description: The ISO 3166-1 alpha-3 country code (e.g., "PRT"). This is the primary code used across the Remote API.
          type: string
        contractor_products_available:
          description: Contractor product names available for this country
          items:
            enum:
            - standard
            - plus
            - cor
            type: string
          type: array
        country_subdivisions:
          description: Administrative subdivisions of the country (e.g., states, provinces, districts). Null if the country has no subdivisions relevant to Remote's services.
          items:
            $ref: '#/components/schemas/CountrySubdivision'
          nullable: true
          type: array
        employment_agreement_preview_available:
          description: Whether an Employment Agreement preview is available for this country.
          type: boolean
        eor_onboarding:
          description: Whether EOR (Employer of Record) onboarding is available in this country.
          type: boolean
        locked_benefits:
          description: When benefit plan selections become locked for this country (e.g., "after_first_hire" means benefits cannot be changed after the first employee is hired).
          type: string
        name:
          description: The country's full English name.
          type: string
        region:
          description: The geographic region the country belongs to (e.g., "Europe", "Asia", "Americas").
          type: string
        subregion:
          description: The geographic subregion (e.g., "Southern Europe", "Southeast Asia"). Null for some countries.
          nullable: true
          type: string
        supported_json_schemas:
          description: The list of JSON schema form names available for this country (e.g., "address_details", "contract_details"). Use these with the Show form schema endpoint to get country-specific field requirements.
          items:
            type: string
          type: array
      required:
      - alpha_2_code
      - code
      - name
      title: NullableCountry
      type: object
    EmploymentStatus:
      description: 'The current status of the employment record.


        - `active`: The employee is fully onboarded and actively working.

        - `created`: The employment has been created but onboarding has not started.

        - `pre_hire`: A pre-hire employment record, created before formal onboarding begins.

        - `created_awaiting_reserve`: The employment is created but waiting for a risk reserve deposit to be paid.

        - `created_reserve_paid`: The risk reserve has been paid and the employment can proceed with onboarding.

        - `initiated`: Onboarding has been started by the employer.

        - `invited`: The employee has been invited to complete their self-enrollment on Remote.

        - `pending`: The employment is pending review or further action before it can become active.

        - `review`: The employment is under review by Remote (e.g., contract or compliance review).

        - `archived`: The employment has been terminated or offboarded.

        - `deleted`: The employment record has been deleted.

        '
      enum:
      - active
      - created
      - pre_hire
      - created_awaiting_reserve
      - created_reserve_paid
      - initiated
      - invited
      - pending
      - review
      - job_title_review
      - pending_post_self_enrollment_actions
      - offboarding
      - archived
      - deleted
      example: active
      title: EmploymentStatus
      type: string
