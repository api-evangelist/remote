policy:
  limit_count: 300
  window: 1 minute
  scope: company
  notes: >-
    The Remote API processes up to 300 authenticated requests per minute per
    company (not per token). Requests from all tokens belonging to the same
    company share the limit. The window starts at the first request and resets
    60 seconds later.
  exceeded_status: 429
